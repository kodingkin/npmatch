name: Backend CI

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Run bundling
        run: make bundle
