name: Build & Push to ECR

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - frontend
          - backend
          - ingestion
          - all

env:
  AWS_REGION: ap-northeast-1

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [frontend, backend, ingestion]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        if: |
          inputs.service == 'all' || 
          inputs.service == matrix.service
        run: |
          IMAGE=$REGISTRY/npmatch-${{ matrix.service }}:${{ github.sha }}
          LATEST=$REGISTRY/npmatch-${{ matrix.service }}:latest

          docker build -t $IMAGE -t $LATEST ./${{ matrix.service }}
          docker push $IMAGE
          docker push $LATEST