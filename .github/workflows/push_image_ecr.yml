name: Build & Push to ECR

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "ingestion/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - frontend
          - backend
          - ingestion
          - all

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "frontend/**"
            backend:
              - "backend/**"
            ingestion:
              - "ingestion/**"

  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
          - service: backend
            changed: ${{ needs.detect-changes.outputs.backend }}
          - service: ingestion
            changed: ${{ needs.detect-changes.outputs.ingestion }}

    steps:
      - name: Skip if not needed
        if: |
          (github.event_name == 'push' && matrix.changed != 'true') ||
          (github.event_name == 'workflow_dispatch' && !(inputs.service == 'all' || inputs.service == matrix.service))
        run: |
          echo "Skipping ${{ matrix.service }}"
          exit 0

      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        run: |
          IMAGE=$ECR_REGISTRY/npmatch-${{ matrix.service }}:${{ github.sha }}
          LATEST=$ECR_REGISTRY/npmatch-${{ matrix.service }}:latest

          docker build -t $IMAGE -t $LATEST ./${{ matrix.service }}
          docker push $IMAGE
          docker push $LATEST