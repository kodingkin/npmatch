name: Build & Push to ECR

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - frontend
          - backend
          - ingestion
          - all

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  build-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [frontend, backend, ingestion]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build & push
        if: |
          inputs.service == 'all' || 
          inputs.service == matrix.service
        run: |
          IMAGE=$ECR_REGISTRY/npmatch-${{ matrix.service }}:${{ github.sha }}
          LATEST=$ECR_REGISTRY/npmatch-${{ matrix.service }}:latest

          docker build -t $IMAGE -t $LATEST ./${{ matrix.service }}
          docker push $IMAGE
          docker push $LATEST